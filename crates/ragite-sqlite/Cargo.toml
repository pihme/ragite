[package]
name = "ragite-sqlite"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loadable SQLite extension for RAGite"
publish = false

[lib]
name = "ragite"
crate-type = ["cdylib"]

[features]
default = ["builtin-model"]
builtin-model = ["ragite-core/builtin-model"]

[dependencies]
libsqlite3-sys = { version = "0.38.2", features = ["loadable_extension"] }
ragite-core = { path = "../ragite-core", default-features = false }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
