name: Mutation

# Manual cargo-mutants run for ragite-core. Not on push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/mutants

      - name: Mutation test ragite-core
        run: cargo mutants -p ragite-core --no-shuffle

      - name: Upload mutant outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-${{ github.run_id }}
          if-no-files-found: ignore
          path: mutants.out
