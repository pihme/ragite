name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main may later cut a release. Do not cancel that run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A release-plz pull request only bumps versions and changelogs; the code was
    # tested on main. It gets release-pr-check instead. The push to main after the
    # merge still runs every job.
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-plz-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/bindings

      - name: Test
        run: make test

  # The documented commands without the Makefile, on a fresh checkout (TC-270).
  fresh-checkout:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-plz-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/sqlite

      - name: Commands from CONTRIBUTING.md
        run: |
          cargo fetch --locked
          cargo build -p ragite-sqlite
          cargo test --workspace

  # sqlite3 comes from a pinned sqlite.org build on both runners (see below).
  parity-platform:
    name: parity (${{ matrix.os }})
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-plz-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Require the smudged model files
        shell: bash
        run: bash .github/scripts/require-smudged-models.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # sqlite3 is pinned to an official sqlite.org build on both runners instead of
      # whatever Homebrew/Chocolatey serve that day (Apple's sqlite3 cannot load
      # extensions; the Chocolatey feed fails intermittently and choco still exits 0).
      - name: Install pinned SQLite
        shell: bash
        env:
          SQLITE_URL: ${{ runner.os == 'Windows' && 'https://sqlite.org/2026/sqlite-tools-win-x64-3540100.zip' || 'https://sqlite.org/2026/sqlite-tools-osx-arm64-3540100.zip' }}
          SQLITE_SHA256: ${{ runner.os == 'Windows' && 'fb20997ade5583a5fbf1e36db7bc3c82c9416b3f314f16961e1572aa4e49487d' || 'f5ba6f9c08bcb3b7220dea07238cd3de88b936cf5b956d7fe458bf2ff0782db6' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" != arm64 ]; then
            echo "::error::pinned sqlite3 is arm64, runner is $(uname -m)"; exit 1
          fi
          dir="$RUNNER_TEMP/sqlite"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/sqlite.zip" "$SQLITE_URL"
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          echo "$SQLITE_SHA256  $dir/sqlite.zip" | $sum -c -
          unzip -q -o "$dir/sqlite.zip" -d "$dir"
          chmod +x "$dir"/sqlite3* || true
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$dir" >> "$GITHUB_PATH"; else echo "$dir" >> "$GITHUB_PATH"; fi

      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail
          echo "bash $BASH_VERSION"
          for t in git git-lfs cargo rustc sqlite3; do
            command -v "$t" >/dev/null || { echo "::error::required tool '$t' not on PATH"; exit 1; }
          done
          git --version; git lfs version; cargo --version
          v=$(sqlite3 -version); echo "sqlite3 $v"
          case "$v" in 3.54.1*) ;; *) echo "::error::expected pinned sqlite3 3.54.1, got: $v"; exit 1;; esac

      - name: Build the extension and run the parity test
        shell: bash
        run: |
          command -v sqlite3
          sqlite3 -version
          cargo build -p ragite-sqlite
          cargo test -p ragite-sqlite --test parity

  # Coverage report only; there is no threshold and it never gates a merge.
  # The same job feeds SonarQube Cloud (coverage plus Clippy findings), so the
  # instrumented build runs only once.
  coverage:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-plz-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Scan pull requests and main only, and only when the secret exists.
      # Dependabot and fork PRs get no secret; Dependabot is also skipped explicitly.
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          # Sonar needs the full history for blame and new-code detection.
          fetch-depth: 0

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/coverage

      - name: Measure coverage
        # The integration tests load target/debug/libragite.so through sqlite3,
        # so build the instrumented extension first, then run the tests.
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          # The license test runs `cargo metadata --offline` (see Makefile).
          cargo fetch --locked
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo build -p ragite-sqlite
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo test --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '## Rust coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov
          path: lcov.info

      - name: Clippy report for SonarQube Cloud
        if: env.RUN_SONAR == 'true'
        # Report only: findings show up in SonarQube Cloud and do not fail the job.
        run: |
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo clippy --workspace --all-targets --locked --message-format=json > clippy-report.json

      - name: SonarQube Cloud scan
        if: env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Build and test the release profile that the published extension uses.
  release-profile:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-plz-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/release

      - name: Build the release extension
        run: |
          # The license test runs `cargo metadata --offline`, so fetch every crate first.
          cargo fetch --locked
          start=$(date +%s)
          env -u RAGITE_MODEL_PATH cargo build -p ragite-sqlite --release
          echo "AFTER_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "AFTER_B=$(stat -c %s target/release/libragite.so)" >> "$GITHUB_ENV"

      - name: Entry point and model section survive strip and LTO
        run: |
          so=target/release/libragite.so
          nm -D --defined-only "$so" | grep -w sqlite3_ragite_init
          out=$(sqlite3 :memory: ".load ./$so" "SELECT technical_id FROM ragite_default_model();" "SELECT length(ragite_embed_model((SELECT technical_id FROM ragite_default_model()), 'hello', 'passage'));")
          echo "$out"
          echo "$out" | grep -q 'potion-retrieval-32M@'
          echo "$out" | grep -qx 2048

      # The published library is built with zig against glibc 2.34 stubs, so it
      # loads on any distribution with glibc 2.34 or newer. Since #94 a plain
      # cargo build in the Nix shell linked against Nix's glibc (2.44).
      - name: Build the published library against glibc 2.34
        run: |
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo zigbuild -p ragite-sqlite --release --target x86_64-unknown-linux-gnu.2.34

      - name: Published library stays on the glibc 2.34 baseline
        run: bash .github/scripts/check-glibc-baseline.sh target/x86_64-unknown-linux-gnu/release/libragite.so 2.34

      - name: Published library loads on Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-gnu/release/libragite.so:/x/libragite.so:ro" \
            -v "$PWD/.github/scripts/smoke-load-extension.sh:/smoke.sh:ro" \
            ubuntu:22.04@sha256:e0f80c829509ef4df9e76bd8944eb7b8ec25cbb379b112a7f9448b2c77a77c9b bash /smoke.sh /x/libragite.so

      - name: Test suite and parity against the release extension
        run: env -u RAGITE_MODEL_PATH cargo test --workspace --release

      - name: Summary
        run: |
          {
            echo '## Release profile'
            echo
            echo '| libragite.so bytes | build seconds |'
            echo '| --- | --- |'
            echo "| $AFTER_B | $AFTER_S |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Replaces the jobs above on release-plz-* branches: versions, Cargo.lock and
  # changelog must agree, and nothing else may change.
  release-pr-check:
    if: ${{ startsWith(github.head_ref || github.ref_name, 'release-plz-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions and changelog
        run: bash .github/scripts/check-release-pr.sh origin/main

  # release-plz only sees commits that touch a crate directory. A change to the
  # workspace Cargo.toml or the built-in Model must refresh the matching
  # release-inputs.txt file (ragite-sqlite or ragite-core) so the commit reaches
  # the changelog and the release notes.
  release-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the release-inputs.txt files
        run: |
          make release-inputs
          if ! git diff --exit-code -- crates/ragite-sqlite/release-inputs.txt crates/ragite-core/release-inputs.txt \
             || [ -n "$(git status --porcelain -- crates/ragite-core/release-inputs.txt)" ]; then
            echo "::error::A release-inputs.txt file is stale or not committed. Run 'make release-inputs' and commit both files, so release-plz lists this change."
            exit 1
          fi

  # Open or update the release pull request after tests pass on main.
  # A stale release-inputs file must stop it too, or the change misses the changelog.
  # It also waits for release-plz-release: run in parallel, it saw the merged
  # release pull request's version before the tag existed and opened a second,
  # changelog-only release pull request for the same version (#62, #84).
  # On a push with nothing to release, release-plz-release still succeeds, so
  # this job runs as before. If tagging fails, this job is skipped.
  release-plz-pr:
    needs: [test, release-profile, release-inputs, release-plz-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pihme'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # release-plz may compile ragite-core; build.rs rejects LFS pointer files.
          lfs: true
          persist-credentials: false

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/sqlite

      - name: Open the release pull request
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        with:
          command: release-pr
        env:
          # A pull request opened with GITHUB_TOKEN gets its CI runs held at
          # "action_required" until someone approves them. With a RELEASE_TOKEN
          # secret (fine-grained token: Contents and Pull requests read/write on
          # this repository) the release pull request runs CI on its own.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Tag and publish the GitHub Release only when that pull request merges.
  release-plz-release:
    needs: [test, release-profile, fresh-checkout, parity-platform, release-inputs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pihme'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/release

      - name: Cut the release
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the extension
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(printf '%s' "$RELEASES" | jq -r '.[] | select(.package_name == "ragite-sqlite") | .tag')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "ragite-sqlite was not released"
            exit 0
          fi
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo zigbuild -p ragite-sqlite --release --target x86_64-unknown-linux-gnu.2.34
          so=target/x86_64-unknown-linux-gnu/release/libragite.so
          bash .github/scripts/check-glibc-baseline.sh "$so" 2.34
          gh release upload "$tag" \
            "$so" \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD_PARTY_NOTICES.md \
            --clobber
