# SonarQube Cloud analysis, run from the `coverage` job in .github/workflows/ci.yml.
# Automatic analysis does not support Rust, so this project uses CI-based analysis.
sonar.organization=pihme
sonar.projectKey=pihme_ragite
sonar.projectName=ragite

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/tests/**,target/**,models/**,third_party/**,fuzz/corpus/**,bench/results/**,bench/.models/**,**/*.safetensors,**/tokenizer.json
# Only the Rust crates are measured by cargo-llvm-cov.
sonar.coverage.exclusions=bench/**,fuzz/**,.github/**,**/build.rs
# The unicode61 tables repeat one small record shape for hundreds of lines.
# Copy-paste detection treats that table as duplicated code and fails the
# quality gate. The bytes are generated data, not copied logic.
sonar.cpd.exclusions=crates/ragite-sqlite/src/vtab/unicode61.rs

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Written by the coverage job before the scan.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json
