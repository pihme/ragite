name: Model benchmark

# Quality run for one candidate Model (REQ-92). Manual only; never on push.
# CPU costs are measured on the fixed benchmark machine, not here.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Candidate name from bench/candidates.toml"
        required: true
        default: potion-base-8M
      datasets:
        description: "Space-separated MTEB datasets"
        required: true
        default: "mteb/scifact mteb/nfcorpus mteb/fiqa"
      max_docs:
        description: "Corpus subsample for a dry run (empty = full)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Require the smudged model files
        run: bash .github/scripts/require-smudged-models.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install harness
        run: pip install -r bench/requirements.txt
      # Workflow inputs are passed as environment variables. Pasting an input
      # into a run script would let a model name or a dataset string execute as shell.
      - name: Build extension with the candidate
        id: build
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python3 - "$MODEL" <<'PY'
          import os, subprocess, sys, tomllib
          name = sys.argv[1]
          with open("bench/candidates.toml", "rb") as fh:
              models = tomllib.load(fh)["model"]
          m = next(item for item in models if item["name"] == name)
          qp = m.get("query_prefix", "")
          pp = m.get("passage_prefix", "")
          ext = subprocess.check_output(
              ["bench/build_model.sh", m["hf"], name, qp, pp], text=True
          ).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in (
                  ("hf", m["hf"]),
                  ("kind", m["kind"]),
                  ("pp", pp),
                  ("ext", ext),
              ):
                  fh.write(f"{key}<<RAGITE_VALUE_END\n{value}\nRAGITE_VALUE_END\n")
          PY
      - name: Parity check against the reference
        env:
          EXT: ${{ steps.build.outputs.ext }}
          HF: ${{ steps.build.outputs.hf }}
          KIND: ${{ steps.build.outputs.kind }}
          PP: ${{ steps.build.outputs.pp }}
        run: python3 bench/parity/check_parity.py --extension "$EXT" --hf "$HF" --kind "$KIND" --passage-prefix "$PP"
      - name: Quality
        env:
          EXT: ${{ steps.build.outputs.ext }}
          MODEL: ${{ inputs.model }}
          DATASETS: ${{ inputs.datasets }}
          MAX_DOCS: ${{ inputs.max_docs }}
        run: |
          set -euo pipefail
          read -r -a datasets <<< "$DATASETS"
          args=()
          if [ -n "$MAX_DOCS" ]; then
            args+=(--max-docs "$MAX_DOCS")
          fi
          for ds in "${datasets[@]}"; do
            python3 bench/run_quality.py --extension "$EXT" --dataset "$ds" \
              "${args[@]}" \
              --out "bench/results/quality/${MODEL//\//_}--${ds//\//_}.json"
          done
          if [ -s bench/questions/own.jsonl ]; then
            python3 bench/run_quality.py --extension "$EXT" --own bench/questions/own.jsonl \
              --out "bench/results/quality/${MODEL//\//_}--own.json"
          fi
      - uses: actions/upload-artifact@v7
        if: always()  # keep the datasets that finished when a later one fails
        with:
          name: bench-${{ inputs.model }}
          path: bench/results/
