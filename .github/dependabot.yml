# Commit prefixes follow the release rules in AGENTS.md (release-plz):
#   Cargo (workspace / and fuzz/, one group) -> fix(deps): patch release (crates
#     are release paths). A bump that only touches fuzz/Cargo.lock cuts no release:
#     it changes no crate directory and no release input.
#   Go language tests -> chore(deps): tests only
#   bench pip deps -> chore(deps): harness only, not needed to build or test
#   Nix shells -> fix(deps): patch release, because nix/release/flake.lock is a
#     release input (see below). All 8 shells are one group, so the bundled PR
#     always touches that lock and every Nix bump goes as fix(deps).
#   GitHub Actions -> ci(deps): no release
# A Nix lock is a release input when CI builds a released artifact inside that Nix
# environment and the artifact depends on it: the release job builds libragite.so
# inside nix/release, so nix/release/flake.lock is listed in
# crates/ragite-sqlite/release-inputs.txt (make release-inputs).
# Never reword a Dependabot title into feat! (see AGENTS.md).
version: 2
updates:
  # fuzz/ is its own Cargo workspace (publish = false), not shipped. One block and
  # one group with /, so a crate in both locks comes as one PR.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: fix
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /tests/languages/go
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /bench
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  # All Nix shells in one block and one group: one bundled PR per run.
  # Add every extra shell (nix/<name>/flake.lock) under `directories:`.
  - package-ecosystem: nix
    directories:
      - /nix/reference-env
      - /nix/sqlite
      - /nix/bindings
      - /nix/coverage
      - /nix/mutants
      - /nix/fuzz
      - /nix/bench
      - /nix/release
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      # fix when a lock in this block is a release input (see above), otherwise chore.
      prefix: fix
      include: scope
    groups:
      nix:
        patterns: ["*"]
