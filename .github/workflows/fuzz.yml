name: Fuzz

# Manual libFuzzer run for the chunkers (REQ-95). Not on push or pull request.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzz target"
        required: true
        default: all
        type: choice
        options:
          - all
          - html
          - markdown
          - docling
      duration:
        description: "Seconds to run each target"
        required: true
        default: 600
        type: number

permissions:
  contents: read
  actions: write

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/fuzz

      - name: Fuzz
        env:
          DURATION: ${{ inputs.duration }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          duration="$DURATION"
          if [ "$duration" -lt 1 ]; then
            echo "duration must be at least 1 second"
            exit 1
          fi
          if [ "$TARGET" = all ]; then
            targets="html markdown docling"
          else
            targets="$TARGET"
          fi
          for target in $targets; do
            cargo fuzz run "$target" -- -max_total_time="$duration" -rss_limit_mb=2048 -timeout=10
          done

      - name: Upload crashes and corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            fuzz/artifacts
            fuzz/corpus
