# Commit prefixes follow the release rules in AGENTS.md (release-plz):
#   workspace Cargo deps -> fix(deps): patch release (crates are release paths)
#   fuzz Cargo workspace -> chore(deps): not shipped
#   Go language tests -> chore(deps): tests only
#   bench pip deps -> chore(deps): harness only, not needed to build or test
#   Nix reference shells -> chore(deps): CI toolchain, not shipped
#   GitHub Actions -> ci(deps): no release
# Never reword a Dependabot title into feat! (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: fix
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # fuzz/ is its own Cargo workspace (publish = false). Not shipped.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      fuzz-cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /tests/languages/go
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /bench
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  # All Nix shells in one block and one group: one bundled PR per run.
  - package-ecosystem: nix
    directories:
      - /nix/reference-env
      - /nix/sqlite
      - /nix/bindings
      - /nix/coverage
      - /nix/mutants
      - /nix/fuzz
      - /nix/bench
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      nix:
        patterns: ["*"]
