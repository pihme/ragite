name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main may later cut a release. Do not cancel that run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Require the smudged model files
        run: |
          for file in models/*/model.safetensors models/*/tokenizer.json; do
            test -s "$file"
            if head -c 40 "$file" | grep -q 'git-lfs'; then
              echo "model file is still a Git LFS pointer: $file (check out with lfs: true / git lfs pull)"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/languages/go/go.mod
          cache: false

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-0

      - name: Test
        run: make test

  # Coverage report only; there is no threshold and it never gates a merge.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-0

      - name: Measure coverage
        # The integration tests load target/debug/libragite.so through sqlite3,
        # so build the instrumented extension first, then run the tests.
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          # The license test runs `cargo metadata --offline` (see Makefile).
          cargo fetch --locked
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo build -p ragite-sqlite
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo test --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '## Rust coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: lcov
          path: lcov.info

  # Build and test the release profile that the published extension uses.
  release-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Require the smudged model files
        run: |
          for file in models/*/model.safetensors models/*/tokenizer.json; do
            test -s "$file"
            if head -c 40 "$file" | grep -q 'git-lfs'; then
              echo "model file is still a Git LFS pointer: $file (check out with lfs: true / git lfs pull)"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Build the release extension
        run: |
          # The license test runs `cargo metadata --offline`, so fetch every crate first.
          cargo fetch --locked
          start=$(date +%s)
          env -u RAGITE_MODEL_PATH cargo build -p ragite-sqlite --release
          echo "AFTER_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "AFTER_B=$(stat -c %s target/release/libragite.so)" >> "$GITHUB_ENV"

      - name: Entry point and model section survive strip and LTO
        run: |
          so=target/release/libragite.so
          nm -D --defined-only "$so" | grep -w sqlite3_ragite_init
          out=$(sqlite3 :memory: ".load ./$so" "SELECT technical_id FROM ragite_default_model();" "SELECT length(ragite_embed_model((SELECT technical_id FROM ragite_default_model()), 'hello', 'passage'));")
          echo "$out"
          echo "$out" | grep -q 'potion-retrieval-32M@'
          echo "$out" | grep -qx 2048

      - name: Test suite and parity against the release extension
        run: env -u RAGITE_MODEL_PATH cargo test --workspace --release

      - name: Summary
        run: |
          {
            echo '## Release profile'
            echo
            echo '| libragite.so bytes | build seconds |'
            echo '| --- | --- |'
            echo "| $AFTER_B | $AFTER_S |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Open or update the release pull request after tests pass on main.
  release-plz-pr:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pihme'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # release-plz may compile ragite-core; build.rs rejects LFS pointer files.
          lfs: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Open the release pull request
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tag and publish the GitHub Release only when that pull request merges.
  release-plz-release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pihme'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Require the smudged model files
        run: |
          for file in models/*/model.safetensors models/*/tokenizer.json; do
            test -s "$file"
            if head -c 40 "$file" | grep -q 'git-lfs'; then
              echo "model file is still a Git LFS pointer: $file (check out with lfs: true / git lfs pull)"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cut the release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the extension
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(printf '%s' "$RELEASES" | jq -r '.[] | select(.package_name == "ragite-sqlite") | .tag')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "ragite-sqlite was not released"
            exit 0
          fi
          env -u RAGITE_MODEL_PATH -u RAGITE_MODEL_NAME -u RAGITE_MODEL_REVISION -u RAGITE_QUERY_PREFIX -u RAGITE_PASSAGE_PREFIX \
            cargo build -p ragite-sqlite --release
          gh release upload "$tag" \
            target/release/libragite.so \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD_PARTY_NOTICES.md \
            --clobber
